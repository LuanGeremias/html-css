<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Testando Formulários</h1>
    <form action="cadrastro.php" method="get" autocomplete="on">
        <p>
            <label for="inome">Nome: </label>
            <input type="text" name="nome" id="inome" placeholder="Nome Completo" autocomplete="name">
        </p>
        <p>
            <label for="idata">Data da prova </label>
            <input type="date" name="data" id="idata">
        </p>
        <p>
            <label for="ihora">Horas da prova</label>
            <input type="time" name="hora" id="ihora">
        </p>
        <p>
            <label for="imes">Mês</label>
            <input type="month" name="mes" id="imes">
        </p>
        <p>
            <label for="media">Media </label>
            <input type="number" name="media" id="imedia" placeholder="3">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
