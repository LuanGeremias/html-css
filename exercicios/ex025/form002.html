<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Testando Formulario</h1>
    <form action="cadrastro.php" method="post">
        <p>
            <label for="iusu">Usuario: </label>
            <input type="text" name="usu" id="iusu" minlength="5"
            maxlength="15" size="10" placeholder="Nome" autocomplete="username">
        </p>
        <p>
            <label for="isen">Senha: </label>
            <input type="text" name="sen" id="isen" minlength="8"
            max="16" size="10" placeholder="Senha" autocomplete="new-password">
        </p>
        <p>
            <input type="submit" value="Proximo">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
