<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div#container {
            background-color: rgb(90, 28, 149);
            display: flex;
            flex-flow: row wrap;
        }

        div.item {
            background-color: rgb(255, 180, 81);
            border: 1px solid black;
            text-align: center;
            flex-basis: 100px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="item">A</div>
        <div class="item">outro coneudo</div>
        <div class="item">C</div>
        <div class="item">Conudo um pouco maior</div>
        <div class="item">E</div>
        <div class="item">Contufo um pouco maior ainda</div>
        <div class="item">G</div>
    </div>
</body>
</html>
