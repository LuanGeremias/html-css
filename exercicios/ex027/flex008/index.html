<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
</head>
<style>
    #container {
        background-color: rgb(255, 164, 98);
        display: flex;
        flex-flow: row wrap;
    }

    .item {
        background-color: rgb(162, 62, 255);
        border: 1px solid black;
        text-align: center;
        padding: 20px;
    }

    #i1 {
        order: -2;
    }

    #i2 {
        order: 4;
    }

    #i3 {
        order: 2;
    }

    #i4 {
        order: 9;
    }

    #i5 {
        order: 1;
    }

    #i6 {
        order: 5;
    }

    #i7 {
        order: 3;
    }

    #i8 {
        order: 6;
    }
</style>
<body>
    <div id="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
        <div class="item" id="i8">H</div>
    </div>
</body>
</html>
