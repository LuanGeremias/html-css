<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div#container {
            background-color: rgb(90, 28, 149);
            display: flex;
            
        }

        div.item {
            background-color: rgb(255, 180, 81);
            flex-basis: 250px;
            border: 1px solid black;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="item" style="flex-shrink: 1;">A</div>
        <div class="item" style="flex-shrink: 0;">B</div>
        <div class="item" style="flex-shrink: 2;">C</div>
    </div>
</body>
</html>
