<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div#container {
            background-color: rgb(90, 28, 149);
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: rgb(255, 180, 81);
            flex-basis: 200px;
            border: 1px solid black;
            text-align: center;
         
        }

        #A {
            flex-shrink: 0;
            flex-grow: 1;
        }

        #B {
            flex-shrink: 1;
            flex-grow:  0;
        }

        #C {
            flex-shrink: 0;
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="item" id="A">A</div>
        <div class="item" id="B">B</div>
        <div class="item" id="C">C</div>
    </div>
</body>
</html>
